\<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мои машины — Онлайн</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b0d10;
    color: white;
}

header {
    background: #15181d;
    padding: 25px;
    text-align: center;
    border-bottom: 2px solid #292d33;
}

header h1 {
    margin: 0;
    font-size: 32px;
}

header p {
    color: #999;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 25px;
}

.search {
    width: 100%;
    padding: 15px;
    margin-bottom: 20px;
    border: 0;
    border-radius: 10px;
    background: #1c2026;
    color: white;
    font-size: 17px;
}

.add-button {
    width: 100%;
    padding: 15px;
    border: 0;
    border-radius: 10px;
    background: #e60000;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 25px;
}

.add-button:hover {
    background: #ff2020;
}

.cars {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
}

.car {
    background: #171a1f;
    border-radius: 15px;
    overflow: hidden;
    border: 1px solid #292e35;
}

.car img {
    width: 100%;
    height: 220px;
    object-fit: cover;
}

.info {
    padding: 18px;
}

.info h2 {
    margin-top: 0;
}

.price {
    color: #00e676;
    font-size: 23px;
    font-weight: bold;
    margin: 10px 0;
}

.item {
    margin: 9px 0;
    color: #ccc;
}

.description {
    color: #aaa;
    line-height: 1.5;
    margin-top: 15px;
}

.comment {
    background: #24282e;
    padding: 12px;
    border-radius: 8px;
    margin-top: 15px;
    color: #ccc;
}

.buttons {
    display: flex;
    gap: 8px;
    margin-top: 15px;
}

.call,
.map {
    flex: 1;
    padding: 12px;
    text-align: center;
    color: white;
    text-decoration: none;
    border-radius: 8px;
    font-weight: bold;
}

.call {
    background: #12a84a;
}

.map {
    background: #2864d7;
}

.delete {
    width: 100%;
    margin-top: 10px;
    padding: 11px;
    border: 0;
    border-radius: 8px;
    background: #a00000;
    color: white;
    cursor: pointer;
}

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.8);
    overflow-y: auto;
    padding: 20px;
    z-index: 100;
}

.form {
    max-width: 600px;
    margin: 30px auto;
    background: #181b20;
    padding: 25px;
    border-radius: 15px;
}

.form h2 {
    margin-top: 0;
}

.form input,
.form textarea {
    width: 100%;
    padding: 13px;
    margin: 7px 0 15px;
    background: #272b31;
    border: 0;
    border-radius: 8px;
    color: white;
    font-size: 15px;
}

.form textarea {
    height: 100px;
    resize: vertical;
}

.close {
    float: right;
    padding: 8px 12px;
    border: 0;
    border-radius: 8px;
    background: #444;
    color: white;
    cursor: pointer;
}

.save {
    width: 100%;
    padding: 14px;
    border: 0;
    border-radius: 8px;
    background: #e60000;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.preview {
    display: none;
    width: 100%;
    max-height: 250px;
    object-fit: cover;
    border-radius: 10px;
    margin-bottom: 15px;
}
</style>
</head>

<body>

<header>
    <h1>🚗 МОИ МАШИНЫ</h1>
    <p>Онлайн каталог автомобилей</p>
</header>

<div class="container">

    <input
        id="search"
        class="search"
        placeholder="🔎 Поиск машины..."
    >

    <button
        class="add-button"
        onclick="openForm()"
    >
        ➕ Добавить машину
    </button>

    <div id="cars" class="cars"></div>

</div>


<!-- ОКНО ДОБАВЛЕНИЯ -->

<div id="modal" class="modal">

    <div class="form">

        <button
            class="close"
            onclick="closeForm()"
        >
            ✕
        </button>

        <h2>Добавить машину</h2>

        <input
            id="name"
            placeholder="Название, например Toyota Camry 2.0"
        >

        <input
            id="price"
            type="number"
            placeholder="Цена в долларах"
        >

        <input
            id="phone"
            placeholder="Номер телефона"
        >

        <input
            id="location"
            placeholder="Местоположение"
        >

        <textarea
            id="description"
            placeholder="Описание машины"
        ></textarea>

        <textarea
            id="comment"
            placeholder="Комментарий"
        ></textarea>

        <input
            id="photo"
            type="file"
            accept="image/*"
        >

        <img
            id="preview"
            class="preview"
        >

        <button
            class="save"
            onclick="addCar()"
        >
            🚗 Сохранить машину онлайн
        </button>

    </div>

</div>


<!-- FIREBASE -->

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";

import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    deleteDoc,
    doc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

import {
    getStorage,
    ref,
    uploadBytes,
    getDownloadURL,
    deleteObject
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-storage.js";


/*
==================================================
ВСТАВЬ СЮДА СВОЙ FIREBASE CONFIG
==================================================
*/

const firebaseConfig = {

    apiKey: "YOUR_API_KEY",

    authDomain:
        "YOUR_PROJECT.firebaseapp.com",

    projectId:
        "YOUR_PROJECT_ID",

    storageBucket:
        "YOUR_PROJECT.firebasestorage.app",

    messagingSenderId:
        "YOUR_SENDER_ID",

    appId:
        "YOUR_APP_ID"

};


/*
==================================================
FIREBASE
==================================================
*/

const app =
    initializeApp(firebaseConfig);

const db =
    getFirestore(app);

const storage =
    getStorage(app);


/*
==================================================
ЭЛЕМЕНТЫ
==================================================
*/

const modal =
    document.getElementById("modal");

const photo =
    document.getElementById("photo");

const preview =
    document.getElementById("preview");

const search =
    document.getElementById("search");


/*
==================================================
ПРЕДПРОСМОТР ФОТО
==================================================
*/

photo.addEventListener("change", function() {

    const file = this.files[0];

    if (!file) return;

    const reader =
        new FileReader();

    reader.onload = function(e) {

        preview.src =
            e.target.result;

        preview.style.display =
            "block";

    };

    reader.readAsDataURL(file);

});


/*
==================================================
ОТКРЫТЬ / ЗАКРЫТЬ
==================================================
*/

window.openForm = function() {

    modal.style.display =
        "block";

};


window.closeForm = function() {

    modal.style.display =
        "none";

};


/*
==================================================
ДОБАВИТЬ МАШИНУ
==================================================
*/

window.addCar = async function() {

    const name =
        document.getElementById("name").value.trim();

    const price =
        document.getElementById("price").value.trim();

    const phone =
        document.getElementById("phone").value.trim();

    const location =
        document.getElementById("location").value.trim();

    const description =
        document.getElementById("description").value.trim();

    const comment =
        document.getElementById("comment").value.trim();

    const file =
        photo.files[0];


    if (
        !name ||
        !price ||
        !phone ||
        !location ||
        !file
    ) {

        alert(
            "Заполни название, цену, телефон, место и фотографию!"
        );

        return;
    }


    try {

        /*
        Загружаем фотографию
        */

        const fileName =
            "cars/" +
            Date.now() +
            "_" +
            file.name;

        const storageRef =
            ref(storage, fileName);


        await uploadBytes(
            storageRef,
            file
        );


        const imageURL =
            await getDownloadURL(
                storageRef
            );


        /*
        Сохраняем машину
        */

        await addDoc(
            collection(db, "cars"),
            {

                name: name,

                price: price,

                phone: phone,

                location: location,

                description: description,

                comment: comment,

                image: imageURL,

                storagePath: fileName,

                createdAt:
                    serverTimestamp()

            }
        );


        alert(
            "✅ Машина добавлена онлайн!"
        );


        clearForm();

        closeForm();

        loadCars();


    } catch(error) {

        console.error(error);

        alert(
            "Ошибка: " +
            error.message
        );

    }

};


/*
==================================================
ЗАГРУЗИТЬ МАШИНЫ
==================================================
*/

async function loadCars() {

    const container =
        document.getElementById("cars");

    container.innerHTML =
        "<p>Загрузка машин...</p>";


    try {

        const snapshot =
            await getDocs(
                collection(db, "cars")
            );


        container.innerHTML = "";


        const text =
            search.value.toLowerCase();


        snapshot.forEach(function(document) {

            const car =
                document.data();

            const id =
                document.id;


            if (
                !car.name
                    .toLowerCase()
                    .includes(text)
            ) {

                return;

            }


            const phone =
                car.phone.replace(
                    /[^\d+]/g,
                    ""
                );


            const map =
                "https://www.google.com/maps/search/?api=1&query="
                +
                encodeURIComponent(
                    car.location
                );


            const card =
                document.createElement("div");

            card.className =
                "car";


            card.innerHTML = `

                <img
                    src="${escapeHTML(car.image)}"
                >

                <div class="info">

                    <h2>
                        ${escapeHTML(car.name)}
                    </h2>

                    <div class="price">
                        💰 ${Number(car.price).toLocaleString()} $
                    </div>

                    <div class="item">
                        📍 ${escapeHTML(car.location)}
                    </div>

                    <div class="item">
                        📞 ${escapeHTML(car.phone)}
                    </div>

                    <div class="description">
                        ${escapeHTML(
                            car.description || ""
                        )}
                    </div>

                    <div class="comment">
                        💬 ${escapeHTML(
                            car.comment || ""
                        )}
                    </div>

                    <div class="buttons">

                        <a
                            class="call"
                            href="tel:${phone}"
                        >
                            📞 Позвонить
                        </a>

                        <a
                            class="map"
                            href="${map}"
                            target="_blank"
                        >
                            📍 Карта
                        </a>

                    </div>

                    <button
                        class="delete"
                        onclick="deleteCar('${id}')"
                    >
                        🗑 Удалить
                    </button>

                </div>
            `;


            container.appendChild(
                card
            );

        });


    } catch(error) {

        console.error(error);

        container.innerHTML =
            "<p>❌ Не удалось загрузить машины.</p>";

    }

}


/*
==================================================
УДАЛИТЬ МАШИНУ
==================================================
*/

window.deleteCar = async function(id) {

    if (
        !confirm(
            "Удалить эту машину?"
        )
    ) {
        return;
    }


    try {

        await deleteDoc(
            doc(db, "cars", id)
        );

        loadCars();

    } catch(error) {

        alert(
            "Ошибка удаления: " +
            error.message
        );

    }

};


/*
==================================================
ОЧИСТИТЬ ФОРМУ
==================================================
*/

function clearForm() {

    document.getElementById("name").value = "";

    document.getElementById("price").value = "";

    document.getElementById("phone").value = "";

    document.getElementById("location").value = "";

    document.getElementById("description").value = "";

    document.getElementById("comment").value = "";

    photo.value = "";

    preview.style.display =
        "none";

}


/*
==================================================
ПОИСК
==================================================
*/

search.addEventListener(
    "input",
    loadCars
);


/*
==================================================
ЗАЩИТА HTML
==================================================
*/

function escapeHTML(text) {

    return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


/*
==================================================
ЗАПУСК
==================================================
*/

loadCars();

</script>

</body>
</html>
