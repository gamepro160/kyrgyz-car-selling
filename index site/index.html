<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои машины</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        header {
            background: #1c1c1c;
            padding: 25px;
            text-align: center;
            border-bottom: 2px solid #333;
        }

        header h1 {
            margin: 0;
            font-size: 32px;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 25px;
        }

        .form {
            background: #1c1c1c;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
        }

        .form h2 {
            margin-top: 0;
        }

        input,
        textarea {
            width: 100%;
            padding: 13px;
            margin: 8px 0;
            border: none;
            border-radius: 8px;
            background: #292929;
            color: white;
            font-size: 15px;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        button {
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            margin-top: 8px;
        }

        .add-btn {
            background: #e60000;
            color: white;
            width: 100%;
        }

        .add-btn:hover {
            background: #ff2222;
        }

        .cars {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .car {
            background: #1c1c1c;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.4);
        }

        .car img {
            width: 100%;
            height: 210px;
            object-fit: cover;
            display: block;
        }

        .car-info {
            padding: 18px;
        }

        .car h3 {
            margin: 0 0 10px;
            font-size: 23px;
        }

        .price {
            color: #00ff66;
            font-size: 21px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .description {
            color: #ddd;
            line-height: 1.5;
        }

        .comment {
            margin-top: 12px;
            padding: 10px;
            background: #292929;
            border-radius: 8px;
            color: #aaa;
        }

        .delete-btn {
            background: #aa0000;
            color: white;
            width: 100%;
        }

        .delete-btn:hover {
            background: #dd0000;
        }

        #photoPreview {
            width: 100%;
            max-height: 250px;
            object-fit: cover;
            border-radius: 10px;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>

<body>

<header>
    <h1>🚗 МОИ МАШИНЫ</h1>
</header>

<div class="container">

    <div class="form">
        <h2>➕ Добавить машину</h2>

        <input type="text" id="name" placeholder="Название машины">
        
        <input type="number" id="price" placeholder="Стоимость">

        <textarea id="description"
                  placeholder="Описание машины"></textarea>

        <textarea id="comment"
                  placeholder="Комментарий"></textarea>

        <input type="file"
               id="photo"
               accept="image/*">

        <img id="photoPreview">

        <button class="add-btn" onclick="addCar()">
            Добавить машину
        </button>
    </div>

    <div class="cars" id="cars"></div>

</div>

<script>

let cars = JSON.parse(localStorage.getItem("myCars")) || [];

const photoInput = document.getElementById("photo");
const preview = document.getElementById("photoPreview");

photoInput.addEventListener("change", function() {

    const file = this.files[0];

    if (file) {
        const reader = new FileReader();

        reader.onload = function(e) {
            preview.src = e.target.result;
            preview.style.display = "block";
        };

        reader.readAsDataURL(file);
    }
});


function addCar() {

    const name = document.getElementById("name").value;
    const price = document.getElementById("price").value;
    const description = document.getElementById("description").value;
    const comment = document.getElementById("comment").value;
    const photo = document.getElementById("photo").files[0];

    if (!name || !price || !photo) {
        alert("Заполни название, цену и выбери фотографию!");
        return;
    }

    const reader = new FileReader();

    reader.onload = function(e) {

        const car = {
            id: Date.now(),
            name: name,
            price: price,
            description: description,
            comment: comment,
            photo: e.target.result
        };

        cars.push(car);

        localStorage.setItem("myCars", JSON.stringify(cars));

        showCars();

        document.getElementById("name").value = "";
        document.getElementById("price").value = "";
        document.getElementById("description").value = "";
        document.getElementById("comment").value = "";
        document.getElementById("photo").value = "";

        preview.style.display = "none";
    };

    reader.readAsDataURL(photo);
}


function showCars() {

    const container = document.getElementById("cars");

    container.innerHTML = "";

    cars.forEach(function(car) {

        const card = document.createElement("div");

        card.className = "car";

        card.innerHTML = `
            <img src="${car.photo}" alt="${car.name}">

            <div class="car-info">

                <h3>${car.name}</h3>

                <div class="price">
                    $${Number(car.price).toLocaleString()}
                </div>

                <div class="description">
                    ${car.description || "Описание отсутствует"}
                </div>

                <div class="comment">
                    💬 ${car.comment || "Комментарий отсутствует"}
                </div>

                <button class="delete-btn"
                        onclick="deleteCar(${car.id})">
                    🗑 Удалить
                </button>

            </div>
        `;

        container.appendChild(card);
    });
}


function deleteCar(id) {

    if (confirm("Удалить эту машину?")) {

        cars = cars.filter(function(car) {
            return car.id !== id;
        });

        localStorage.setItem("myCars", JSON.stringify(cars));

        showCars();
    }
}


showCars();

</script>

</body>
</html>
